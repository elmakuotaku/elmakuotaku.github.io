<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream en Vivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: Arial, sans-serif; background-color: #0e0e10; overflow: hidden; }
        .stream-container { display: flex; width: 100%; height: 100vh; flex-direction: row; }
        .video-box { flex: 3; background-color: #000; height: 100%; }
        .chat-box { flex: 1; border-left: 2px solid #1f1f23; height: 100%; }
        .chat-box iframe { border: none; width: 100%; height: 100%; }
        @media (max-width: 768px) {
            .stream-container { flex-direction: column; overflow-y: auto; }
            .video-box { flex: none; height: 56.25vw; }
            .chat-box { flex: none; height: calc(100vh - 56.25vw); border-left: none; border-top: 2px solid #1f1f23; }
        }
    </style>
</head>
<body>

    <div class="stream-container">
        <!-- Contenedor del Reproductor de Video -->
        <div id="twitch-embed" class="video-box"></div>

        <!-- Contenedor del Chat (CON LOS GUIONES CORREGIDOS) -->
        <div class="chat-box">
            <iframe 
                src="https://twitch.tv"
                darkpopout>
            </iframe>
        </div>
    </div>

    <!-- Script oficial de Twitch -->
    <script src="https://twitch.tv"></script>
    <script type="text/javascript">
      new Twitch.Player("twitch-embed", {
        channel: "ElMakuOtaku",
        width: "100%",
        height: "100%",
        autoplay: true,
        muted: false,
        parent: ["elmakuotaku-github-io.vercel.app"] /* CON LOS GUIONES CORREGIDOS */
      });
    </script>

</body>
</html>
